<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISU Esports - Player Card</title>
    <link rel="stylesheet" href="./player-card.css" />
  </head>
  <!-- One player's full-screen card (1920x1080). ?station=N picks the roster player whose
       STATION is N. Rendered offscreen by the controller and sent out as NDI
       "ISU Player Card NN"; also openable in a browser for checking. -->
  <body>
    <main class="pc" id="pc" data-state="empty">
      <div class="pc-hero" id="pc-hero"></div>
      <div class="pc-shade"></div>
      <header class="pc-team">
        <div class="pc-logo" id="pc-logo"></div>
        <div><span id="pc-team-short">ISU</span><strong id="pc-team-name">IDAHO STATE</strong></div>
        <em id="pc-station">STATION 01</em>
      </header>
      <section class="pc-player">
        <div class="pc-portrait" id="pc-portrait"><b id="pc-initials">?</b></div>
        <div class="pc-id">
          <span id="pc-role">PLAYER</span>
          <strong id="pc-handle">NO PLAYER</strong>
          <small id="pc-name"></small>
          <em id="pc-hero-name"></em>
        </div>
      </section>
      <section class="pc-stats">
        <header><span id="pc-stats-label">LAST MAP</span><small id="pc-stats-map"></small></header>
        <div class="pc-ead">
          <div><i>ELIMS</i><b id="pc-elims">–</b></div>
          <div><i>ASSISTS</i><b id="pc-assists">–</b></div>
          <div><i>DEATHS</i><b id="pc-deaths">–</b></div>
        </div>
        <div class="pc-big">
          <div><i>DAMAGE</i><b id="pc-damage">–</b></div>
          <div><i>HEALING</i><b id="pc-healing">–</b></div>
          <div><i>MITIGATED</i><b id="pc-mitigation">–</b></div>
        </div>
      </section>
      <footer class="pc-footer"><span id="pc-event">COLLEGIATE ESPORTS</span><strong>IDAHO STATE ESPORTS</strong></footer>
    </main>
    <script src="./player-card.js" defer></script>
  </body>
</html>
