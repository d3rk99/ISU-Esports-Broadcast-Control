# ISU Esports Broadcast suite, Rust rewrite (branch rust-rewrite, Derk 2026-10-15).
# Goal: same features, logic and behaviour as the Electron/Node apps, to measure performance.
# Restream is already Rust (../restream); it stays its own workspace.
[workspace]
resolver = "2"
members = ["crates/isu-core", "crates/isu-server", "crates/isu-ocr", "crates/isu-net", "crates/isu-bridge", "crates/isu-display", "crates/isu-control"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
unicode-normalization = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal", "process"] }
axum = { version = "0.8", features = ["ws"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs", "cors"] }
anyhow = "1"
tracing = "0.1"
rand = "0.9"
subtle = "2"
flate2 = "1"
png = "0.18"
sha2 = "0.10"
tokio-tungstenite = "0.28"
url = "2"
eframe = "0.36"
egui = "0.36"
dirs = "6"
libloading = "0.8"
cpal = "0.15"
fastrand = "2"
