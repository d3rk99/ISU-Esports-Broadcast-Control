[package]
name = "isu-display"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ISU Display Client (station PC) in Rust + egui: port of electron/displays/display-client-main.cjs, ndi-receiver.cjs, cursor-lock.cjs, client/noise.js and the client pages."

[[bin]]
name = "isu-display-client"
path = "src/main.rs"

[dependencies]
isu-core = { path = "../isu-core" }
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
dirs.workspace = true
libloading.workspace = true
cpal.workspace = true
fastrand.workspace = true

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
