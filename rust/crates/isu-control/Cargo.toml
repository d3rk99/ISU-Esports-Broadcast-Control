[package]
name = "isu-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ISU Esports Broadcast Control (controller) in Rust + egui: electron/main.cjs wiring (services, settings files, overlay + Companion servers) and the src/app.js controller window."

[lib]
path = "src/lib.rs"

[[bin]]
name = "isu-broadcast-control"
path = "src/main.rs"

[dependencies]
isu-core = { path = "../isu-core" }
isu-server = { path = "../isu-server" }
isu-net = { path = "../isu-net" }
isu-ocr = { path = "../isu-ocr" }
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
dirs.workspace = true
rfd = "0.17"
