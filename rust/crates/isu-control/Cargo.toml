[package]
name = "isu-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ISU Esports Broadcast Control (controller) in Rust + egui: electron/main.cjs wiring (services, settings files, overlay + Companion servers) and the src/app.js controller window."

[lib]
path = "src/lib.rs"

[[bin]]
name = "isu-broadcast-control"
path = "src/main.rs"

[dependencies]
isu-core = { path = "../isu-core" }
isu-server = { path = "../isu-server" }
isu-net = { path = "../isu-net" }
isu-ocr = { path = "../isu-ocr" }
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
dirs.workspace = true
rfd = "0.17"
png.workspace = true
base64 = "0.22"
# team logos / portraits / hero art in the window (the overlay server serves them on 3174)
egui_extras = { version = "0.36", default-features = false, features = ["http", "image", "webp"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
egui_kittest = { version = "=0.36.2", features = ["eframe"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
