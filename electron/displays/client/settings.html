<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>ISU Display Client - Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header><small>ISU DISPLAY CLIENT</small><h1>Station setup</h1><span id="meta"></span></header>
  <form id="form">
    <label>Station<select name="station"></select></label>
    <div class="pair">
      <label>Controller PC (IP or name)<input name="controller" spellcheck="false" placeholder="192.168.1.20"></label>
      <label>Port<input name="port" type="number" min="1" max="65535"></label>
    </div>
    <label>Display key<input name="key" type="password" autocomplete="off" placeholder="Same as the controller (blank if none)"></label>
    <label>OBS PC for NDI (optional)<input name="ndiHost" spellcheck="false" placeholder="Only if NDI can't find the feed by itself"></label>
    <div class="pair">
      <label>Player monitor (game mirror)<select name="playerDisplay"></select></label>
      <label>Audience monitor (this window)<select name="stageDisplay"></select></label>
    </div>
    <fieldset class="noise">
      <legend>Pink noise (headset)</legend>
      <div class="pair">
        <label>Headset output<select name="noiseDevice"></select></label>
        <label>Max volume on this PC (%)<input name="noiseMaxVolume" type="number" min="0" max="100" step="5"></label>
      </div>
      <p class="hint">Pick the headset, not the IEMs. The controller turns it on and off; this cap is the loudest it can ever get here.</p>
      <button type="button" id="noise-test">TEST 3 SECONDS</button>
    </fieldset>
    <label class="check"><input name="cursorLock" type="checkbox"><span>Keep the mouse on the player monitor (Ctrl+Alt+L)</span></label>
    <label class="check"><input name="startWithWindows" type="checkbox"><span>Start with Windows (on by default)</span></label>
    <footer><span id="saved"></span><button type="submit">SAVE</button></footer>
    <p class="ndi-note">NDI&reg; is a registered trademark of Vizrt NDI AB &middot; ndi.video. The NDI runtime is included with this app.</p>
  </form>
  <script src="noise.js"></script>
  <script src="settings.js"></script>
</body>
</html>
