<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISU Stage Display Client</title>
    <link rel="stylesheet" href="./stage-client.css">
  </head>
  <body class="mode-hold">
    <video id="gameplay" autoplay muted playsinline></video>
    <canvas id="ndi-card" width="1920" height="1080"></canvas>
    <div id="preset-shell">
      <iframe id="preset-frame" title="Stage preset"></iframe>
    </div>
    <iframe id="preload-frame" title="Prepared stage preset"></iframe>
    <main id="scene">
      <section class="scene-card">
        <div class="isu-mark">ISU</div>
        <p id="eyebrow">IDAHO STATE ESPORTS</p>
        <h1 id="headline">STAGE DISPLAY</h1>
        <span id="subhead">Holding graphic</span>
      </section>
    </main>
    <button id="config-open" type="button" title="Stage display settings" aria-label="Stage display settings">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.16.4.4.75.73 1 .3.25.7.4 1.1.4H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"></path>
      </svg>
    </button>
    <section id="config-panel" aria-hidden="true">
      <form id="config-form">
        <header>
          <div>
            <span>ISU STAGE DISPLAY CLIENT</span>
            <h2>Station Setup</h2>
          </div>
          <button id="config-close" type="button">Close</button>
        </header>
        <label>
          Station ID
          <select name="stationId"></select>
        </label>
        <label>
          Controller URL
          <input name="controller" type="text" placeholder="http://CONTROL-PC-IP:3174" spellcheck="false">
        </label>
        <label>
          Stage Key
          <input name="stageKey" type="password" placeholder="Same key as the controller (blank if none)" autocomplete="off" spellcheck="false">
        </label>
        <label>
          Player Display
          <select name="playerDisplay"></select>
        </label>
        <label>
          Stage Display
          <select name="stageDisplay"></select>
        </label>
        <label>
          Wall Position
          <select name="wallPosition"></select>
        </label>
        <label class="config-check">
          <input name="cursorLockEnabled" type="checkbox">
          <span>Lock cursor to player display</span>
        </label>
        <label class="config-check">
          <input name="startWithWindows" type="checkbox">
          <span>Start with Windows (after sign-in)</span>
        </label>
        <p>Keep this client EXE in a permanent folder before enabling startup.</p>
        <p id="config-status">Changes save to this PC only.</p>
        <footer>
          <button type="submit">Save and Reconnect</button>
        </footer>
      </form>
    </section>
    <script src="./stage-client.js"></script>
  </body>
</html>
