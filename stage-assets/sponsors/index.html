<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sponsors</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050506; color: #fff; font-family: Arial, Helvetica, sans-serif; }
      body { display: grid; place-items: center; background: radial-gradient(circle at 50% 50%, rgba(244,121,32,.22), transparent 45%), repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 10px, transparent 10px 28px), #08090d; }
      main { display: grid; gap: 4vh; justify-items: center; text-align: center; }
      p { margin: 0; color: #f47920; font-size: 2vh; font-weight: 950; letter-spacing: .34em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(70px, 8vw, 180px); line-height: .9; font-style: italic; font-weight: 950; letter-spacing: .04em; text-transform: uppercase; }
      .slots { display: grid; grid-template-columns: repeat(4, 18vw); gap: 1.6vw; }
      .slot { display: grid; place-items: center; height: 16vh; border: .25vh solid rgba(244,121,32,.7); background: rgba(18,20,25,.78); color: #8f96a5; font-size: 2vh; font-weight: 900; letter-spacing: .18em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <p>Idaho State Esports</p>
      <h1>Thank You Sponsors</h1>
      <section class="slots">
        <div class="slot">Sponsor</div>
        <div class="slot">Sponsor</div>
        <div class="slot">Sponsor</div>
        <div class="slot">Sponsor</div>
      </section>
    </main>
  </body>
</html>
