<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISU Idle</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050506; color: #fff; font-family: Arial, Helvetica, sans-serif; }
      body { display: grid; place-items: center; background: linear-gradient(90deg, rgba(244,121,32,.28), transparent 24%, transparent 76%, rgba(244,121,32,.22)), repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 10px, transparent 10px 28px), #07080b; }
      main { display: grid; justify-items: center; gap: 2.4vh; text-align: center; filter: drop-shadow(0 2.5vh 5vh rgba(0,0,0,.55)); }
      .mark { display: grid; place-items: center; width: 18vh; height: 18vh; border: .55vh solid #f47920; background: linear-gradient(135deg, #f47920, #101114 58%); font-size: 5.2vh; font-style: italic; font-weight: 950; letter-spacing: -.08em; }
      h1 { margin: 0; font-size: clamp(72px, 8vw, 190px); line-height: .9; font-style: italic; font-weight: 950; letter-spacing: .04em; }
      p { margin: 0; color: #f47920; font-size: 2.2vh; font-weight: 900; letter-spacing: .34em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">ISU</div>
      <h1>ISU ESPORTS</h1>
      <p>Bengals Rise</p>
    </main>
  </body>
</html>
