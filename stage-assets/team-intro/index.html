<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Intro</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030405; color: #fff; font-family: Arial, Helvetica, sans-serif; }
      body { display: grid; align-items: center; background: linear-gradient(90deg, rgba(244,121,32,.55), rgba(8,10,14,.96) 30%, rgba(8,10,14,.96) 70%, rgba(45,140,255,.42)), #050506; }
      main { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; min-height: 58vh; }
      .side { display: grid; gap: 2vh; padding: 0 6vw; }
      .side.right { justify-items: end; text-align: right; }
      .label { color: #f47920; font-size: 2vh; font-weight: 950; letter-spacing: .32em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(76px, 7vw, 180px); line-height: .9; font-style: italic; font-weight: 950; letter-spacing: .03em; text-transform: uppercase; text-shadow: 0 2vh 4vh rgba(0,0,0,.55); }
      .versus { display: grid; place-items: center; width: 18vh; height: 18vh; border: .55vh solid #f47920; background: #101114; font-size: 5vh; font-style: italic; font-weight: 950; box-shadow: 0 0 6vh rgba(244,121,32,.22); }
    </style>
  </head>
  <body>
    <main>
      <section class="side"><span class="label">Home Team</span><h1>Idaho State</h1></section>
      <div class="versus">VS</div>
      <section class="side right"><span class="label">Away Team</span><h1>Opponent</h1></section>
    </main>
  </body>
</html>
